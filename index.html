<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <section class="contact-form">
        <div class="form-header">
          <h1>Contact Us For Work</h1>
          <p>
            We'd love to hear from you. Please reach out using the form below,
            or use the contact info on the right.
          </p>
        </div>

        <form>
          <div class="form-field">
            <label for="name">Name</label>
            <input id="name" type="text" placeholder="Enter your name" required />
          </div>

          <div class="form-field">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="Enter your email" required />
          </div>

          <div class="form-field">
            <label for="subject">Subject</label>
            <input id="subject" type="text" placeholder="Your subject" />
          </div>

          <div class="form-field">
            <label for="message">Message</label>
            <textarea id="message" placeholder="Your message" required></textarea>
          </div>

          <div class="form-submit">
            <button type="submit">Send Message</button>
          </div>
        </form>
      </section>

     
      <section class="contact-info">
        <div class="info-content">
          <h2>Our Location</h2>
          <div class="info-item">
            <p>📍 2783 E Tamarind Dr, Fresno, CA 93730</p>
            <p>📞 (978) 452-2449</p>
            <p>✉️ practicemakespersonperfect0.com</p>
          </div>
          <div class="map-container">
            <img src="images/map.png" alt="Map showing our location" />
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
